<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market PWA - Akıllı Barkod Okuyucu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>
    <header>
        <h1>🛒 Market Akıllı Asistan</h1>
        <div class="mode-selector">
            <button id="btnSingleMode" class="active">Tekli Sorgu Modu</button>
            <button id="btnCartMode">Sepet Modu</button>
        </div>
    </header>

    <main>
        <!-- Kamera ve Tarayıcı Alanı -->
        <section class="scanner-section">
            <div class="video-container">
                <video id="scanner" autoplay playsinline muted></video>
                <div class="scan-overlay"></div>
            </div>
            
            <div id="cameraError" class="error-message hidden">
                Kamera izni reddedildi veya cihazda kamera bulunamadı. Lütfen tarayıcı ayarlarından izin verin.
            </div>

            <!-- Alternatif Manuel Giriş -->
            <div class="manual-entry">
                <input type="text" id="manualBarcode" placeholder="Barkod numarasını girin...">
                <button id="btnManualSubmit">Sorgula / Ekle</button>
            </div>
        </section>

        <!-- Sonuç / Bilgi Alanı (Tekli Mod) -->
        <section id="singleResultSection" class="result-section">
            <h2>Ürün Bilgisi</h2>
            <div id="productCard" class="card placeholder">
                <p>Henüz bir ürün okunmadı.</p>
            </div>
        </section>

        <!-- Sepet Alanı (Sepet Modu) -->
        <section id="cartSection" class="cart-section hidden">
            <h2>Sepetim</h2>
            <div class="cart-list-container">
                <ul id="cartList">
                    <!-- Sepet ürünleri buraya eklenecek -->
                </ul>
            </div>
            <div class="cart-summary">
                <h3>Toplam Tutar: <span id="cartTotal">0.00</span> TL</h3>
                <button id="btnClearCart" class="danger-btn">Sepeti Temizle</button>
            </div>
        </section>
    </main>

    <!-- Bildirim / Toast Alanı -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
    <script>
        // Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Kayıt Başarılı:', reg.scope))
                    .catch(err => console.log('Service Worker Kayıt Hatası:', err));
            });
        }
    </script>
</body>
</html>
